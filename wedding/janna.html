<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Свадьба</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
        }

        .fullscreen {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        /* 📌 ФОТО — с отступами, но приближенное */
        .fullscreen img {
            width: 90%;              /* на телефоне почти на всю ширину */
            max-width: 600px;        /* на компьютере ограничиваем, чтобы не расплывалось */
            height: auto;
            display: block;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            background: #ffffff;
        }

        /* На телефонах — шире */
        @media (max-width: 480px) {
            .fullscreen img {
                width: 95%;
                max-width: none;
            }
        }

        /* На компьютерах — фото крупнее (приближено) */
        @media (min-width: 1024px) {
            .fullscreen img {
                width: 75%;          /* ← увеличиваем ширину */
                max-width: 900px;    /* ← больше максимум */
            }
        }

        /* ----- КЛИКАБЕЛЬНЫЕ ЗОНЫ (ЦВЕТНЫЕ ДЛЯ ОТЛАДКИ) ----- */
        .click-area {
            position: absolute;
            cursor: pointer;
            /* ⚠️ ЦВЕТНЫЕ ЗОНЫ ДЛЯ НАСТРОЙКИ — видно где кликать */
            background: rgba(255, 0, 0, 0.25);
            border: 2px dashed red;
            border-radius: 6px;
            transition: background 0.2s;
        }

        /* При наведении подсвечиваем ярче */
        .click-area:hover {
            background: rgba(255, 0, 0, 0.45);
        }

        /* ---- 1-я кнопка: «Дворец Тракосочетания» ---- */
        .area-1 {
            top: 42.5%;
            left: 48.5%;
            width: 7.5%;
            height: 1.5%;
        }

        /* ---- 2-я кнопка: «Свадебный ужин» ---- */
        .area-2 {
            top: 57.5%;
            left: 48.5%;
            width: 7.5%;
            height: 1.5%;
        }

        /* ---- 3-я кнопка: Google Форма ---- */
        .area-3 {
            top: 89%;
            left: 46.5%;
            width: 7.5%;
            height: 1.5%;
        }

        /* 📱 Телефоны (узкие экраны) */
        @media (max-width: 480px) {
            .area-1 { top: 30%; left: 6%; width: 60%; height: 8%; }
            .area-2 { top: 48%; left: 5%; width: 64%; height: 8%; }
            .area-3 { top: 86%; left: 4%; width: 80%; height: 9%; }
        }
    </style>
</head>
<body>

<div class="fullscreen">
    <img src="base_love.png" alt="Свадебное приглашение" />

    <a class="click-area area-1"
       href="https://yandex.ru/maps/?pt=28.332127,57.812466&z=17"
       target="_blank"
       aria-label="Открыть Яндекс.Карты с местом Дворца Тракосочетания"
    ></a>

    <a class="click-area area-2"
       href="https://yandex.ru/maps/?pt=28.165140,57.892683&z=17"
       target="_blank"
       aria-label="Открыть Яндекс.Карты с местом свадебного ужина"
    ></a>

    <a class="click-area area-3"
       href="https://docs.google.com/forms/d/e/1FAIpQLSfx-0qKuA3qTTJ61V4dJG-qTJT12-SnSEUm4P-4N1UTmMMnpg/viewform?usp=pp_url&entry.1192344535=%D0%9A%D0%B0%D1%80%D1%82%D0%B0%D1%88%D0%BE%D0%B2%D0%B0+%D0%96%D0%B0%D0%BD%D0%BD%D0%B0"
       target="_blank"
       aria-label="Открыть Google Форму для подтверждения"
    ></a>
</div>

</body>
</html>
