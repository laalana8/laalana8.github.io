<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Свадьба</title>
    <style>
        /* Сброс */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
        }

        /* Основной контейнер – всегда подстраивается под ширину */
        .container {
            position: relative;
            width: 100%;
        }

        /* Картинка занимает всю ширину, высота автоматически */
        .container img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Невидимые кликабельные зоны – привязаны к картинке через проценты */
        .click-area {
            position: absolute;
            cursor: pointer;
            background: transparent;
            /* Для отладки можно раскомментировать:
            background: rgba(255,0,0,0.15);
            border: 1px dashed red;
            */
        }

        /* ---- 1-я кнопка: Дворец Тракосочетания (Яндекс.Карты) ---- */
        .area-1 {
            top: 41%;
            left: 8%;
            width: 52%;
            height: 4%;
        }

        /* ---- 2-я кнопка: Свадебный ужин (Яндекс.Карты) ---- */
        .area-2 {
            top: 57%;
            left: 7%;
            width: 56%;
            height: 4%;
        }

        /* ---- 3-я кнопка: Google Форма (внизу) ---- */
        .area-3 {
            top: 94%;
            left: 5%;
            width: 76%;
            height: 6%;
        }

        /* Для больших экранов (шире планшета) можно сделать картинку на весь экран */
        @media (min-width: 768px) {
            .container {
                width: 100vw;
                height: 100vh;
                overflow: hidden;
            }
            .container img {
                width: 100%;
                height: 100%;
                object-fit: contain;  /* как было раньше – вписывается без обрезки */
                background: #ffffff;
            }
            /* Кнопки остаются привязанными к изображению через проценты,
               но теперь они позиционируются относительно контейнера,
               который совпадает по размеру с окном, а внутри картинка масштабируется.
               Чтобы проценты работали корректно, нужно, чтобы контейнер
               имел такие же пропорции, как и картинка? Не совсем.
               При object-fit:contain изображение не растягивается на весь контейнер,
               оно вписывается, и реальные координаты на изображении не совпадают
               с координатами контейнера. Поэтому такой подход не подходит.
               Лучше оставить единый подход: всегда width:100%, auto.
            */
        }

        /* Поэтому переопределим для больших экранов – просто ограничим максимальную ширину, если нужно */
        /* На самом деле, проще оставить везде width:100% и auto – это работает на всех экранах,
           и на компьютере картинка будет во всю ширину окна, что тоже приемлемо.
           Если вы хотите именно fullscreen на компьютере, то нужно использовать
           object-fit:contain и вычислять позиции кнопок через JavaScript или
           использовать разные координаты для разных разрешений. Это сложно.

           Я предлагаю единый универсальный вариант – он будет отлично смотреться
           и на телефоне, и на компьютере. На широком мониторе картинка займёт всю ширину,
           а по высоте будет подстраиваться – это выглядит аккуратно.
        */
    </style>
</head>
<body>

<div class="container">
    <!-- Само приглашение -->
    <img src="Frame.svg" alt="Свадебное приглашение" />

    <!-- Невидимые ссылки -->
    <a class="click-area area-1"
       href="https://yandex.ru/maps/?pt=28.332127,57.812466&z=17"
       target="_blank"
       aria-label="Открыть Яндекс.Карты с местом Дворца Тракосочетания">
    </a>

    <a class="click-area area-2"
       href="https://yandex.ru/maps/?pt=28.165140,57.892683&z=17"
       target="_blank"
       aria-label="Открыть Яндекс.Карты с местом свадебного ужина">
    </a>

    <a class="click-area area-3"
       href="https://docs.google.com/forms/d/e/1FAIpQLSeu5He7AzYlZojtEvK1X2S23Wy5jcsq8QUPGZDdoncTxYOdlg/viewform?usp=pp_url&entry.1192344535=%D0%9A%D0%B0%D1%80%D1%82%D0%B0%D1%88%D0%BE%D0%B2%D0%B0+%D0%96%D0%B0%D0%BD%D0%BD%D0%B0"
       target="_blank"
       aria-label="Открыть Google Форму для подтверждения">
    </a>
</div>

</body>
</html>
