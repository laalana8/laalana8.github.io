<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Свадьба</title>
    <style>
        /* Сброс */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }

        /* Контейнер занимает весь экран */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Изображение вписывается в экран без обрезки */
        .container img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;  /* Вписываем без обрезки */
            object-position: center center;
            max-width: 100vw;
            max-height: 100vh;
        }

        /* Невидимые кликабельные зоны */
        .click-area {
            position: absolute;
            cursor: pointer;
            background: transparent;
            /* Для отладки (раскомментируйте при необходимости):
            background: rgba(255,0,0,0.15);
            border: 1px dashed red;
            */
        }

        /* ---- 1-я кнопка: Дворец Тракосочетания (Яндекс.Карты) ---- */
        .area-1 {
            top: 41%;
            left: 8%;
            width: 52%;
            height: 4%;
        }

        /* ---- 2-я кнопка: Свадебный ужин (Яндекс.Карты) ---- */
        .area-2 {
            top: 57%;
            left: 7%;
            width: 56%;
            height: 4%;
        }

        /* ---- 3-я кнопка: Google Форма (внизу) ---- */
        .area-3 {
            top: 94%;
            left: 5%;
            width: 76%;
            height: 6%;
        }

        /*
           На телефонах изображение вписывается в экран.
           На широких экранах тоже вписывается, но с белыми полями по бокам
           (это нормально, так как изображение портретное)
        */
    </style>
</head>
<body>

<div class="container">
    <!-- Само приглашение (SVG с встроенным изображением) -->
    <img src="test.svg" alt="Свадебное приглашение" />

    <!-- Невидимые ссылки -->
    <a class="click-area area-1"
       href="https://yandex.ru/maps/?pt=28.332127,57.812466&z=17"
       target="_blank"
       aria-label="Открыть Яндекс.Карты с местом Дворца Тракосочетания">
    </a>

    <a class="click-area area-2"
       href="https://yandex.ru/maps/?pt=28.165140,57.892683&z=17"
       target="_blank"
       aria-label="Открыть Яндекс.Карты с местом свадебного ужина">
    </a>

    <a class="click-area area-3"
       href="https://docs.google.com/forms/d/e/1FAIpQLSeu5He7AzYlZojtEvK1X2S23Wy5jcsq8QUPGZDdoncTxYOdlg/viewform?usp=pp_url&entry.1192344535=%D0%9A%D0%B0%D1%80%D1%82%D0%B0%D1%88%D0%BE%D0%B2%D0%B0+%D0%96%D0%B0%D0%BD%D0%BD%D0%B0"
       target="_blank"
       aria-label="Открыть Google Форму для подтверждения">
    </a>
</div>

</body>
</html>
