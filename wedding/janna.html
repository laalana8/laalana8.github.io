<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Свадьба</title>
    <style>
        /* Сброс */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Убираем прокрутку */
            background: #ffffff;
        }

        /* Основной контейнер занимает весь экран */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Фото растягивается на весь экран, сохраняя пропорции.
           При этом оно центрируется, а лишнее обрезается по краям */
        .container img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;  /* Заполняет весь контейнер, обрезая края */
            object-position: center center;
            background: #ffffff;
        }

        /* Невидимые кликабельные зоны – привязаны к картинке через проценты */
        .click-area {
            position: absolute;
            cursor: pointer;
            background: transparent;
            /* Для отладки можно раскомментировать:
            background: rgba(255,0,0,0.15);
            border: 1px dashed red;
            */
        }

        /* ---- 1-я кнопка: Дворец Тракосочетания (Яндекс.Карты) ---- */
        .area-1 {
            top: 41%;
            left: 8%;
            width: 52%;
            height: 4%;
        }

        /* ---- 2-я кнопка: Свадебный ужин (Яндекс.Карты) ---- */
        .area-2 {
            top: 57%;
            left: 7%;
            width: 56%;
            height: 4%;
        }

        /* ---- 3-я кнопка: Google Форма (внизу) ---- */
        .area-3 {
            top: 94%;
            left: 5%;
            width: 76%;
            height: 6%;
        }

        /*
           Для очень широких экранов (компьютеры) можно ограничить ширину,
           чтобы изображение не растягивалось слишком сильно.
           Но для телефонов оно будет занимать 100% экрана по высоте и ширине.
        */
        @media (min-width: 768px) {
            .container {
                max-width: 100vw;
                max-height: 100vh;
            }
            .container img {
                object-fit: contain; /* На компьютерах показываем целиком без обрезки */
                background: #ffffff;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Само приглашение -->
    <img src="test.svg" alt="Свадебное приглашение" />

    <!-- Невидимые ссылки -->
    <a class="click-area area-1"
       href="https://yandex.ru/maps/?pt=28.332127,57.812466&z=17"
       target="_blank"
       aria-label="Открыть Яндекс.Карты с местом Дворца Тракосочетания">
    </a>

    <a class="click-area area-2"
       href="https://yandex.ru/maps/?pt=28.165140,57.892683&z=17"
       target="_blank"
       aria-label="Открыть Яндекс.Карты с местом свадебного ужина">
    </a>

    <a class="click-area area-3"
       href="https://docs.google.com/forms/d/e/1FAIpQLSeu5He7AzYlZojtEvK1X2S23Wy5jcsq8QUPGZDdoncTxYOdlg/viewform?usp=pp_url&entry.1192344535=%D0%9A%D0%B0%D1%80%D1%82%D0%B0%D1%88%D0%BE%D0%B2%D0%B0+%D0%96%D0%B0%D0%BD%D0%BD%D0%B0"
       target="_blank"
       aria-label="Открыть Google Форму для подтверждения">
    </a>
</div>

</body>
</html>
