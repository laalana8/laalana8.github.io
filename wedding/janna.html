<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Свадьба</title>
    <style>
        /* Сброс отступов и полное заполнение экрана */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #ffffff;
        }

        /* Контейнер занимает всю ширину и высоту окна */
        .fullscreen {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Изображение растягивается на весь экран, сохраняя пропорции */
        .fullscreen img {
            width: 100%;
            height: 100%;
            object-fit: contain;  /* или cover, если нужно обрезать */
            display: block;
            background: #ffffff;
        }

        /* ----- НЕВИДИМЫЕ КЛИКАБЕЛЬНЫЕ ЗОНЫ ----- */
        .click-area {
            position: absolute;
            cursor: pointer;
            /* Прозрачный фон, чтобы не перекрывать изображение */
            background: transparent;
            /* Для отладки можно раскомментировать:
            background: rgba(255, 0, 0, 0.15);
            border: 1px dashed red;
            */
        }

        /* ---- 1-я кнопка: «Дворец Тракосочетания» (Яндекс.Карты) ---- */
        .area-1 {
            /* Ориентировочные координаты на фото (верхняя часть) */
            top: 41%;
            left: 8%;
            width: 52%;
            height: 4%;
        }

        /* ---- 2-я кнопка: «Свадебный ужин» (Яндекс.Карты) ---- */
        .area-2 {
            /* Чуть увеличенная область для надёжного попадания */
            top: 57%;
            left: 7%;
            width: 56%;
            height: 4%;
        }

        /* ---- 3-я кнопка: ссылка на Google Форму (в самом низу) ---- */
        .area-3 {
            top: 94%;
            left: 5%;
            width: 76%;
            height: 6%;
        }

        /* Адаптивность для очень узких экранов — можно подкорректировать */
        @media (max-width: 480px) {
            .area-1 { top: 30%; left: 6%; width: 60%; height: 8%; }
            .area-2 { top: 48%; left: 5%; width: 64%; height: 8%; }
            .area-3 { top: 86%; left: 4%; width: 80%; height: 9%; }
        }
    </style>
</head>
<body>

<div class="fullscreen">
    <!-- Фоновое изображение (само приглашение) -->
    <img src="test.png" alt="Свадебное приглашение" />
    <!-- === 1-я невидимая кнопка: Яндекс.Карты (Дворец Тракосочетания) === -->
    <a
        class="click-area area-1"
        href="https://yandex.ru/maps/?pt=28.332127,57.812466&z=17"
        target="_blank"
        aria-label="Открыть Яндекс.Карты с местом Дворца Тракосочетания"
    ></a>

    <!-- === 2-я невидимая кнопка: Яндекс.Карты (Свадебный ужин) === -->
    <a
        class="click-area area-2"
        href="https://yandex.ru/maps/?pt=28.165140,57.892683&z=17"
        target="_blank"
        aria-label="Открыть Яндекс.Карты с местом свадебного ужина"
    ></a>

    <!-- === 3-я невидимая кнопка: Google Форма === -->
    <a
        class="click-area area-3"
        href="https://docs.google.com/forms/d/e/1FAIpQLSeu5He7AzYlZojtEvK1X2S23Wy5jcsq8QUPGZDdoncTxYOdlg/viewform?usp=pp_url&entry.1192344535=%D0%9A%D0%B0%D1%80%D1%82%D0%B0%D1%88%D0%BE%D0%B2%D0%B0+%D0%96%D0%B0%D0%BD%D0%BD%D0%B0"
        target="_blank"
        aria-label="Открыть Google Форму для подтверждения"
    ></a>
</div>

</body>
</html>
