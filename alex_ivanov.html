<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding</title>
    <!-- Привет! Я знал, что ты сюда полезешь! Это пасхалка. Главное не быть лысыми нам на свадьбе. -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard', cursive;
            background: #ffffff;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
        }

        .photo-container {
            width: 100%;
        }

        .photo-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .button-section {
            padding: 20px 15px 30px;
            text-align: center;
            background: #fff;
        }

        .cute-button {
            display: inline-block;
            padding: 12px 30px;
            font-size: 16px;
            font-family: 'Comic Sans MS', 'Chalkboard', cursive;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #f5deb3 0%, #e8c9a0 100%);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 
                0 6px 0 #d4b48a,
                0 10px 15px rgba(245, 222, 179, 0.4);
            transition: all 0.2s ease;
            position: relative;
            top: -4px;
        }

        .cute-button:hover {
            transform: scale(1.05);
            box-shadow: 
                0 6px 0 #d4b48a,
                0 12px 20px rgba(245, 222, 179, 0.5);
        }

        .cute-button:active {
            top: 2px;
            box-shadow: 
                0 2px 0 #d4b48a,
                0 4px 8px rgba(245, 222, 179, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="photo-container">
            <img src="./images/ivanov_alex.png" alt="Wedding Photo">
        </div>
        
        <div class="button-section">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSfIdOKL0SvbSSnrUC7cqTu0bQm8C8CZ5XFaC4WJJp1due9CBw/viewform?usp=pp_url&entry.1192344535=%D0%98%D0%B2%D0%B0%D0%BD%D0%BE%D0%B2+%D0%90%D0%BB%D0%B5%D0%BA%D1%81%D0%B0%D0%BD%D0%B4%D1%80" class="cute-button" target="_blank">
                Нажми для перехода
            </a>
        </div>
    </div>
</body>
</html>
